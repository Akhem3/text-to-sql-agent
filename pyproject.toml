[project]
name = "text-to-sql-agent"
version = "0.1.0"
description = "\"Agent LLM pour traduire du langage naturel en SQL.\""
authors = [
    {name = "Akhenaton MASSAKI"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "transformers (>=5.17.0,<6.0.0)",
    "datasets (>=5.0.1,<6.0.0)",
    "peft (>=0.21.1,<0.22.0)",
    "trl (>=1.14.1,<2.0.0)",
    "torch (>=2.14.0,<3.0.0)",
    "accelerate (>=1.15.0,<2.0.0)",
    "langchain (>=1.4.3,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "sentence-transformers (>=6.1.0,<7.0.0)",
    "streamlit (>=1.64.0,<2.0.0)",
    "faker (>=40.40.0,<41.0.0)",
    "langchain-huggingface (>=1.2.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.9,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)",
    "ipywidgets (>=8.1.9,<9.0.0)"
]
