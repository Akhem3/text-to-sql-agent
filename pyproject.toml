[project]
name = "text-to-sql-agent"
version = "0.1.0"
description = "\"Agent LLM pour traduire du langage naturel en SQL.\""
authors = [
    {name = "Akhenaton MASSAKI"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
# Seulement ce que l'agent servi importe : c'est ce que l'image Docker installe
# (`uv sync --no-default-groups`). Le benchmark est dans `eval`, les modèles (entraînement, inférence HF/MLX,
# notebooks) dans `ml`.
dependencies = [
    "httpx>=0.28.1,<0.29",
    "langgraph>=1.2.12,<2",
]

[dependency-groups]
# Ce que le benchmark et ses tests importent, sans aucun modèle : c'est ce que la CI installe.
# pandas et tqdm sont importés directement par evaluate.py : on les déclare au lieu de compter sur datasets.
eval = [
    "datasets (>=5.0.1,<6.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "tqdm (>=4.70.1,<5.0.0)",
]
ml = [
    "transformers (>=5.17.0,<6.0.0)",
    "peft (>=0.21.1,<0.22.0)",
    "torch (>=2.14.0,<3.0.0)",
    "faker (>=40.40.0,<41.0.0)",
    "mlx-lm>=0.32.2,<0.33.0",
]
dev = [
    "ruff (>=0.16.9,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)",
    "ipywidgets (>=8.1.9,<9.0.0)"
]
# L'interface web (Gradio, qui apporte FastAPI et uvicorn) : ni l'image de l'agent ni la CI n'en ont besoin.
# 6.32.0 écartée : sortie depuis moins de deux semaines au moment de l'ajout.
ui = [
    "gradio>=6.31.0,<6.32.0",
]
# L'API REST de l'agent. Déclarée à part de Gradio, qui apporte aussi FastAPI : l'API ne doit pas dépendre
# de ce que l'interface installe. Version exacte : tous les correctifs 0.162.x suivants étaient sortis
# depuis moins de deux semaines à l'ajout.
api = [
    "fastapi==0.162.0",
    "uvicorn>=0.54.0,<0.55",
]

# Le code tourne depuis la racine (`python -m src.text2sql...`) sans être installé :
# uv ne doit donc pas construire le projet, et aucun [build-system] n'est nécessaire.
[tool.uv]
package = false
# En local, `uv sync` installe tout, comme avant la séparation ; l'image s'en passe avec --no-default-groups.
default-groups = ["dev", "eval", "ml", "ui", "api"]
# Borne une dépendance transitive (apportée par Gradio) sans la déclarer comme dépendance directe.
# 0.0.34 était sortie depuis moins de deux semaines ; la contrainte peut être retirée ensuite.
constraint-dependencies = ["python-multipart<0.0.34"]

# Rend `from src...` importable quelle que soit la commande (`pytest` seul n'ajoute que tests/).
[tool.pytest.ini_options]
pythonpath = ["."]

# À 88, 161 lignes du code existant dépassent la limite, contre 6 à 120.
[tool.ruff]
line-length = 120
